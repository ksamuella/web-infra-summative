# Option B - HAProxy load balancer on Lb01
# Append these sections to /etc/haproxy/haproxy.cfg (keep the existing global/defaults).
# Replace WEB01_IP and WEB02_IP with the real addresses of Web01 and Web02.

frontend quakewatch_front
    bind *:80
    mode http
    default_backend quakewatch_back

backend quakewatch_back
    mode http
    balance roundrobin
    option forwardfor
    http-request set-header X-Forwarded-Proto http
    # Health check hits the app's /health endpoint; a failing server is removed from rotation.
    option httpchk GET /health
    http-check expect status 200
    server web-01 WEB01_IP:80 check inter 5s fall 3 rise 2
    server web-02 WEB02_IP:80 check inter 5s fall 3 rise 2
