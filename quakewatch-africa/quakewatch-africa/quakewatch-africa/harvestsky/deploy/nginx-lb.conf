# Option A - Nginx load balancer on Lb01
# Install as /etc/nginx/sites-available/harvestsky-lb and symlink into sites-enabled.
# Replace WEB01_IP and WEB02_IP with the real addresses of Web01 and Web02.

upstream harvestsky_backend {
    # Round-robin (the default): requests alternate between the two servers.
    server WEB01_IP:80 max_fails=3 fail_timeout=10s;
    server WEB02_IP:80 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Server-to-server endpoints must never be reachable from the internet.
    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://harvestsky_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $http_host;
        # The web servers trust this header only when it comes from this load balancer.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If one backend errors or times out, retry the request on the other.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 3s;
    }
}
