# Template for Web01 and Web02. deploy/deploy.sh replaces the two placeholders:
#   __LB_IP__   address of Lb01 (so the real visitor IP can be recovered from X-Real-IP)
#   __PEER_IP__ address of the other web server (allowed to call /internal/ for account sync)
# Installed as /etc/nginx/sites-available/harvestsky

# Trust the client address forwarded by the load balancer, and only by the load balancer.
set_real_ip_from __LB_IP__;
real_ip_header   X-Real-IP;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Server-to-server account replication: only the peer web server may call this
    # (the shared X-Sync-Secret header is checked by the app as a second layer).
    location /internal/ {
        allow __PEER_IP__;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host            $http_host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
