# A complete local copy of the production setup: two app servers behind a load balancer.
#
#   cp .env.example .env     (fill OPENWEATHER_API_KEY, AUTH_SECRET, SYNC_SECRET)
#   docker compose up --build
#   open http://localhost:8080
#
# Press "Ping 10x" in the app: requests alternate between web-01 and web-02.

x-app-env: &app-env
  OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:?Set OPENWEATHER_API_KEY in .env}
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -hex 32)}
  SYNC_SECRET: ${SYNC_SECRET:?Set SYNC_SECRET in .env (openssl rand -hex 24)}
  TRUST_PROXY: "1"

services:
  app1:
    build: .
    environment:
      <<: *app-env
      SERVER_NAME: web-01
      PEERS: http://app2:3000
    volumes:
      - data1:/data
    restart: unless-stopped

  app2:
    build: .
    environment:
      <<: *app-env
      SERVER_NAME: web-02
      PEERS: http://app1:3000
    volumes:
      - data2:/data
    restart: unless-stopped

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/compose-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped

volumes:
  data1:
  data2:
